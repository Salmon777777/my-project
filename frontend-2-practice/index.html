<!DOCTYPE html>
<html class="document" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="description" content="Выбор даты и времени записи в барбершоп BORODA." />
    <title>Запись в BORODA — JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page">
    <article class="booking" aria-label="Запись в барбершоп BORODA">
      <header class="booking__header">
        <div class="status-bar" aria-hidden="true">
          <span class="status-bar__time">9:41</span>
          <span class="status-bar__indicators"><span class="status-bar__signal">●●●</span><span class="status-bar__battery"></span></span>
        </div>
        <nav class="navigation" aria-label="Навигация по записи">
          <button class="navigation__back" type="button"><span class="navigation__chevron" aria-hidden="true">‹</span> Назад</button>
          <span class="navigation__label">Онлайн-запись</span>
        </nav>
        <section class="progress" aria-label="Шаг 3 из 4: выбор даты и времени">
          <p class="progress__caption">Шаг 3 из 4</p>
          <ol class="progress__steps">
            <li class="progress__step progress__step--complete"><span class="visually-hidden">Услуга выбрана</span></li>
            <li class="progress__step progress__step--complete"><span class="visually-hidden">Мастер выбран</span></li>
            <li class="progress__step progress__step--current" aria-current="step"><span class="visually-hidden">Дата и время</span></li>
            <li class="progress__step"><span class="visually-hidden">Контакты</span></li>
          </ol>
        </section>
      </header>

      <main class="booking__main">
        <section class="calendar" aria-labelledby="calendar-title" id="date-choice">
          <div class="calendar__heading">
            <h2 class="calendar__title" id="calendar-title">Выберите дату</h2>
            <button class="calendar__today" type="button">Сегодня</button>
          </div>
          <div class="calendar__navigation">
            <button class="calendar__arrow" type="button" data-direction="-1" aria-label="Предыдущий месяц">‹</button>
            <h3 class="calendar__month" id="month-title" aria-live="polite"></h3>
            <button class="calendar__arrow" type="button" data-direction="1" aria-label="Следующий месяц">›</button>
          </div>
          <div class="calendar__weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
          <div class="calendar__days" role="group" aria-labelledby="month-title"></div>
          <p class="calendar__hint">Прошедшие даты недоступны. Время — московское.</p>
        </section>
        <section class="time-choice" aria-labelledby="time-title">
          <h1 class="time-choice__title" id="time-title">Выберите время</h1>
          <p class="time-choice__description">Указано время начала визита</p>
          <p class="time-choice__date" aria-live="polite"></p>
          <div class="time-choice__slots" role="group" aria-label="Время начала визита"></div>
          <button class="time-choice__change-date" type="button">Изменить дату</button>
          <p class="booking-message" role="status" hidden></p>
        </section>
      </main>

      <footer class="booking__footer">
        <div class="booking-summary" aria-label="Выбранные дата и время">
          <p class="booking-summary__time" aria-live="polite"></p>
          <button class="booking-summary__continue" type="button" disabled>Продолжить</button>
        </div>
        <div class="home-indicator" aria-hidden="true"><span class="home-indicator__bar"></span></div>
      </footer>
    </article>
    <noscript class="no-script">Для выбора даты и времени включите JavaScript в браузере.</noscript>
    <script src="script.js"></script>
  </body>
</html>
